name: Build Goo Engine Linux

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository -y ppa:deadsnakes/ppa
          sudo apt-get update
          
          # Install core system tools needed to bootstrap the installer script
          sudo apt-get install -y \
            build-essential \
            git \
            git-lfs \
            subversion \
            cmake \
            ninja-build \
            python3 \
            python3.11 \
            python3.11-dev

          # Run the engine's native setup script to automatically map all Linux package variations
          chmod +x ./build_files/build_environment/install_linux_packages.py
          sudo ./build_files/build_environment/install_linux_packages.py

      - name: Download Goo Engine libraries
        run: |
          # Pull down the precompiled platform libraries required by the CMake architecture
          python3 ./build_files/utils/make_update.py

      - name: Compile Goo Engine
        run: |
          make NPROCS=2

      - name: Package Linux build
        run: |
          tar -czf goo-engine-linux.tar.gz \
            -C ../build_linux/bin .

      - name: Upload Linux build
        uses: actions/upload-artifact@v4
        with:
          name: goo-engine-linux
          path: goo-engine-linux.tar.gz
          if-no-files-found: error
          retention-days: 7
