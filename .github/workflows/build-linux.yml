name: Build Goo Engine Linux

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository -y ppa:deadsnakes/ppa
          sudo apt-get update
          
          # Force install all required baseline development packages manually 
          # to ensure CMake doesn't throw "Could NOT find" errors.
          sudo apt-get install -y \
            build-essential \
            git \
            git-lfs \
            subversion \
            cmake \
            ninja-build \
            python3 \
            python3.11 \
            python3.11-dev \
            libx11-dev \
            libxxf86vm-dev \
            libxcursor-dev \
            libxi-dev \
            libxrandr-dev \
            libxinerama-dev \
            libegl-dev \
            libwayland-dev \
            wayland-protocols \
            libxkbcommon-dev \
            libdbus-1-dev \
            libsm-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libepoxy-dev \
            libvulkan-dev \
            mesa-vulkan-drivers \
            libshaderc-dev \
            libjpeg-dev \
            libpng-dev \
            libtiff-dev \
            libfreetype-dev \
            libopenimageio-dev \
            libopencolorio-dev \
            libopenexr-dev \
            libopenjp2-7-dev \
            libwebp-dev \
            libboost-all-dev \
            libtbb-dev \
            libopenal-dev \
            libsdl2-dev \
            libsndfile1-dev \
            libavformat-dev \
            libavcodec-dev \
            libavdevice-dev \
            libavfilter-dev \
            libavutil-dev \
            libswscale-dev \
            libswresample-dev \
            libfftw3-dev \
            libpugixml-dev \
            libgmp-dev \
            libgmpxx4ldbl \
            libembree-dev \
            libopenxr-dev \
            libpotrace-dev

          # Run the engine package script with a non-interactive flag to safely capture edge-case dependencies
          chmod +x ./build_files/build_environment/install_linux_packages.py
          sudo ./build_files/build_environment/install_linux_packages.py --y

      - name: Download Goo Engine libraries
        run: |
          # Use explicit python update mapping to ensure the SVN libraries directory structures are prepared
          python3 ./build_files/utils/make_update.py

      - name: Compile Goo Engine
        run: |
          make NPROCS=2

      - name: Package Linux build
        run: |
          tar -czf goo-engine-linux.tar.gz \
            -C ../build_linux/bin .

      - name: Upload Linux build
        uses: actions/upload-artifact@v4
        with:
          name: goo-engine-linux
          path: goo-engine-linux.tar.gz
          if-no-files-found: error
          retention-days: 7
