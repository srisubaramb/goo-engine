name: Build Goo Engine Linux

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            git-lfs \
            subversion \
            cmake \
            ninja-build \
            python3 \
            libx11-dev \
            libxxf86vm-dev \
            libxcursor-dev \
            libxi-dev \
            libxrandr-dev \
            libxinerama-dev \
            libegl-dev \
            libwayland-dev \
            wayland-protocols \
            libxkbcommon-dev \
            libdbus-1-dev \
            libsm-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libepoxy-dev \
            libvulkan-dev \
            mesa-vulkan-drivers

      - name: Download Goo Engine libraries
        run: make update

      - name: Compile Goo Engine
        run: make NPROCS=2

      - name: Package Linux build
        run: |
          tar -czf goo-engine-linux.tar.gz \
            -C ../build_linux/bin .

      - name: Upload Linux build
        uses: actions/upload-artifact@v4
        with:
          name: goo-engine-linux
          path: goo-engine-linux.tar.gz
          if-no-files-found: error
          retention-days: 7
